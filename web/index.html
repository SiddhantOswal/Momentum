<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121519" />
    <link rel="stylesheet" href="/arc-tokens.css" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <title>Momentum · Production intelligence</title>
    <script>
      // Set the theme before first paint, even when storage is unavailable.
      {
        const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        let savedTheme;
        try { savedTheme = localStorage.getItem("momentum-theme"); } catch {}
        document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
