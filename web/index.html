<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>Momentum · Production intelligence</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try { const t = localStorage.getItem("momentum-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
