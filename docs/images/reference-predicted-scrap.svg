<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Verified reference case: model-predicted scrap comparison</title>
<desc id="desc">For the approved PKBX0041 reference setup, baseline predicted scrap is 100.4 kilograms and optimized predicted scrap is 83 kilograms. The predicted reduction is 17.4 kilograms and 925 Indian rupees. These are model estimates, not measured factory savings. Bars start at zero.</desc>
<rect width="1000" height="360" rx="18" fill="#101719"/>
<text x="38" y="43" fill="#c8a57c" font-family="system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="2">VERIFIED REFERENCE · PKBX0041</text>
<text x="38" y="82" fill="#f0f0e9" font-family="system-ui,sans-serif" font-size="27" font-weight="600">A clearer view of predicted waste reduction</text>
<g stroke="#344043" stroke-width="1"><path d="M205 110V260M405 110V260M605 110V260M805 110V260"/></g>
<g fill="#b7c1c4" font-family="system-ui,sans-serif" font-size="15"><text x="38" y="151">Baseline setup</text><text x="38" y="221">Optimized setup</text><text x="205" y="285" text-anchor="middle">0</text><text x="405" y="285" text-anchor="middle">40</text><text x="605" y="285" text-anchor="middle">80</text><text x="805" y="285" text-anchor="middle">120 kg</text></g>
<rect x="205" y="123" width="502.0" height="43" rx="5" fill="#a5b9c5"/>
<rect x="205" y="193" width="415" height="43" rx="5" fill="#c8a57c"/>
<g fill="#f0f0e9" font-family="system-ui,sans-serif" font-size="19" font-weight="600"><text x="722.0" y="151">100.4 kg</text><text x="635" y="221">83.0 kg</text></g>
<text x="38" y="329" fill="#c8a57c" font-family="system-ui,sans-serif" font-size="18" font-weight="600">17.4 kg · ₹925 predicted reduction</text>
<text x="962" y="329" text-anchor="end" fill="#b7c1c4" font-family="system-ui,sans-serif" font-size="14">Model estimates · not measured factory savings</text>
</svg>
